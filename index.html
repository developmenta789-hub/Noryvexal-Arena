<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#070A12"><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="css/style.css"><title>Noryvexal Arena</title>
<script type="module">
import { firstAuthState, getProfile, isAllowed } from "./js/firebase.js";
const u = await firstAuthState(); let ok = false;
try { ok = !!u && isAllowed(await getProfile(u.uid)); } catch (_) {}
location.replace(ok ? "home.html" : "login.html");
</script></head><style>
/* splash = purane Arena app ka splash (dark #1A1F2E, NORYVEXAL / ARENA / PLAY MORE) */
body{background:#1A1F2E;color:#fff}
.sp{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;text-align:center;padding:24px}
.sp b{font-size:clamp(32px,9vw,42px);letter-spacing:.18em;font-weight:700}
.sp i{font-style:normal;font-size:clamp(17px,5vw,22px);letter-spacing:.35em;font-weight:700;color:#00D9FF;margin-top:4px}
.sp u{display:block;width:80px;height:3px;background:#00D9FF;margin:18px 0}
.sp small{font-size:13px;font-weight:700;color:#95A7BC;letter-spacing:.04em}
.sp .bar{width:min(280px,70vw);height:4px;border-radius:2px;background:rgba(255,255,255,.12);margin-top:64px;overflow:hidden}
.sp .bar::after{content:"";display:block;height:100%;width:40%;border-radius:2px;background:#00D9FF;animation:ld 1.1s ease-in-out infinite}
@keyframes ld{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.sp em{font-style:normal;font-size:11px;color:#6D8198;margin-top:14px}
</style>
<body><main class="sp"><b>NORYVEXAL</b><i>ARENA</i><u></u><small>PLAY MORE &bull; EARN MORE</small><div class="bar"></div><em>Powered by NST</em></main></body></html>
