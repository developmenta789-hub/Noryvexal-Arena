<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#070A12"><meta name="color-scheme" content="dark"><link rel="icon" href="assets/favicon.png"><link rel="preload" href="assets/fonts/Poppins-Regular.ttf" as="font" type="font/ttf" crossorigin><link rel="preload" href="assets/fonts/Poppins-Medium.ttf" as="font" type="font/ttf" crossorigin><link rel="preload" href="assets/fonts/Poppins-Bold.ttf" as="font" type="font/ttf" crossorigin><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap"><link rel="stylesheet" href="css/style.css"><title>Password | Noryvexal Arena</title></head>
<body><div class="bg" aria-hidden="true"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i><i class="grid"></i></div>
<div class="page">
<main class="stage"><aside class="aside"><div class="brand"><img class="logo" src="assets/logo.png" alt="" width="96" height="96"></div>
  <p class="eyebrow" data-brand="product">Noryvexal Arena</p>
  <h2>One more <span class="grad">step.</span></h2>
  <p class="lead">Your password keeps your coins and winnings safe.</p></aside>
<section class="card" aria-labelledby="t">
  <div class="brand"><img class="logo" src="assets/logo.png" alt="Noryvexal logo" width="84" height="84"></div>
  <p class="eyebrow" data-brand="product">Noryvexal Arena</p>
  <h1 id="t"><span id="t1">Set your</span> <span class="grad" id="t2">password</span></h1>
  <p class="sub" id="sub">Checking your account…</p>

  <div class="who" id="who" hidden><img id="av" alt="" width="40" height="40" referrerpolicy="no-referrer"><span><b id="wn"></b><i id="we"></i></span></div>

  <form id="f" novalidate autocomplete="on">
    <input class="sr" id="un" type="email" autocomplete="username" tabindex="-1" aria-hidden="true" readonly>

    <div id="setup" hidden>
      <label class="fld" for="p1"><span class="lbl">Password</span>
      <span class="pw"><input id="p1" type="password" autocomplete="new-password" placeholder="Create a password" maxlength="64" spellcheck="false" autocapitalize="off"><button type="button" class="eye" data-for="p1" aria-label="Show password" aria-pressed="false"><svg class="i-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="i-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.9 10.9 0 0 1 12 19C5.6 19 2 12 2 12a18.5 18.5 0 0 1 5.1-5.9M9.9 4.2A9.7 9.7 0 0 1 12 4c6.4 0 10 8 10 8a18.6 18.6 0 0 1-2.2 3.2M1 1l22 22"/><path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/></svg></button></span></label>
      <div class="meter" id="meter" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <p class="mtxt" id="mtxt" aria-live="polite">&nbsp;</p>
      <ul class="rules" id="rules"><li data-r="len">8+ characters</li><li data-r="let">A letter</li><li data-r="num">A number</li></ul>
      <label class="fld" for="p2"><span class="lbl">Confirm password</span>
      <span class="pw"><input id="p2" type="password" autocomplete="new-password" placeholder="Type it again" maxlength="64" spellcheck="false" autocapitalize="off"><button type="button" class="eye" data-for="p2" aria-label="Show password" aria-pressed="false"><svg class="i-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="i-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.9 10.9 0 0 1 12 19C5.6 19 2 12 2 12a18.5 18.5 0 0 1 5.1-5.9M9.9 4.2A9.7 9.7 0 0 1 12 4c6.4 0 10 8 10 8a18.6 18.6 0 0 1-2.2 3.2M1 1l22 22"/><path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/></svg></button></span></label>
      <p class="mtch" id="mtch" aria-live="polite">&nbsp;</p>
      <button id="save" class="btn pri" type="submit" disabled><span>Save password &amp; continue</span><b class="spinner"></b></button>
    </div>

    <div id="confirm" hidden>
      <label class="fld" for="p0"><span class="lbl">Password</span>
      <span class="pw"><input id="p0" type="password" autocomplete="current-password" placeholder="Enter your password" maxlength="64" spellcheck="false" autocapitalize="off"><button type="button" class="eye" data-for="p0" aria-label="Show password" aria-pressed="false"><svg class="i-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="i-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.9 10.9 0 0 1 12 19C5.6 19 2 12 2 12a18.5 18.5 0 0 1 5.1-5.9M9.9 4.2A9.7 9.7 0 0 1 12 4c6.4 0 10 8 10 8a18.6 18.6 0 0 1-2.2 3.2M1 1l22 22"/><path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/></svg></button></span></label>
      <button id="go" class="btn pri" type="submit"><span>Continue</span><b class="spinner"></b></button>
      <button id="forgot" class="link" type="button">Forgot password?</button>
    </div>
  </form>
  <div id="msg" class="msg" role="alert" aria-live="polite"></div>

  <div class="hint">
    <p class="divider">Not you?</p>
    <button id="switch" class="btn ghost" type="button">Use a different Google account</button>
  </div>
  <p class="legal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span>You'll use this same password in the Payvex wallet app.</span></p>
</section></main>
<footer class="powered"><span data-brand="powered">Powered by NST</span></footer>
</div>
<noscript><p class="banner">Please enable JavaScript to use Noryvexal Arena.</p></noscript>
<script type="module" src="js/password.js"></script></body></html>
